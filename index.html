<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ToDoPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg-color: #f5f5f7; --card-bg: #ffffff; --text-main: #1d1d1f; --accent: #0071e3; --danger: #ff453a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #1c1c1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .iphone-container { width: 393px; height: 852px; background-color: var(--bg-color); border-radius: 44px; display: flex; flex-direction: column; overflow: hidden; }
    header { background-color: var(--card-bg); padding: 24px 16px 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    #task-form { display: flex; padding: 12px 16px; gap: 8px; background-color: var(--card-bg); border-bottom: 1px solid #e5e5ea; }
    #task-desc { flex: 1.8; height: 44px; padding: 0 12px; border: 1px solid #d1d1d6; border-radius: 12px; }
    #task-deadline { flex: 1; height: 44px; padding: 0 8px; border: 1px solid #d1d1d6; border-radius: 12px; }
    button[type="submit"] { width: 44px; height: 44px; background-color: var(--accent); color: white; border: none; border-radius: 12px; }
    main { flex: 1; overflow-y: auto; padding: 12px 16px; }
    #task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    
    /* ESTA ES LA CLAVE: CSS GRID PARA ALINEAR TODO */
    .task-item { 
      background-color: var(--card-bg); 
      padding: 12px; 
      border-radius: 12px; 
      display: grid; 
      grid-template-columns: 1fr auto auto; 
      align-items: center; 
      gap: 10px; 
    }
    
    .task-text { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }
    .tag-corto { background-color: #ffe6e6; color: var(--danger); }
    .tag-medio { background-color: #e6f0ff; color: var(--accent); }
    .action-group { display: flex; gap: 4px; }
    .btn-action { width: 32px; height: 32px; border: none; background: transparent; color: #8e8e93; }
  </style>
</head>
<body>
  <div class="iphone-container">
    <header><h1>ToDo<span>Pro</span></h1></header>
    <form id="task-form">
      <input type="text" id="task-desc" placeholder="Tarea..." required>
      <select id="task-deadline"><option value="corto">Corto</option><option value="medio">Medio</option></select>
      <button type="submit"><i class="fa-solid fa-plus"></i></button>
    </form>
    <main><ul id="task-list"></ul></main>
  </div>
  <script>
    let tasks = [{ id: 1, desc: "Probando nueva estructura", deadline: "corto" }];
    function render() {
      const list = document.getElementById('task-list');
      list.innerHTML = tasks.map(t => `
        <li class="task-item">
          <div class="task-text">${t.desc}</div>
          <span class="task-tag tag-${t.deadline}">${t.deadline}</span>
          <div class="action-group">
            <button class="btn-action"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </li>
      `).join('');
    }
    render();
  </script>
</body>
</html>
