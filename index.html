<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #1c1c1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: -apple-system, sans-serif; }
    .iphone-container { width: 393px; height: 852px; background: #f5f5f7; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
    header { background: white; padding: 30px 20px 20px 20px; border-bottom: 1px solid #e5e5ea; }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }
    h1 span { color: #0071e3; }
    #task-form { display: flex; padding: 15px; gap: 8px; background: white; }
    #task-desc { flex: 1; height: 44px; padding: 0 12px; border: 1px solid #d1d1d6; border-radius: 12px; }
    button[type="submit"] { width: 44px; height: 44px; background: #0071e3; color: white; border: none; border-radius: 12px; }
    main { flex: 1; overflow-y: auto; padding: 15px; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item { background: white; padding: 15px; border-radius: 12px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; }
    .task-text { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 5px; }
    .btn-icon { background: none; border: none; color: #8e8e93; font-size: 1.1rem; padding: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="iphone-container">
    <header><h1>ToDo<span>Pro</span></h1></header>
    <form id="task-form">
      <input type="text" id="task-desc" placeholder="Nueva tarea..." required>
      <button type="submit"><i class="fa-solid fa-plus"></i></button>
    </form>
    <main><ul id="task-list" class="task-list"></ul></main>
  </div>
  <script>
    let tasks = [];
    const form = document.getElementById('task-form');
    form.onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('task-desc');
      tasks.push({ id: Date.now(), desc: input.value });
      input.value = '';
      render();
    };
    function render() {
      const list = document.getElementById('task-list');
      list.innerHTML = tasks.map((t, i) => `
        <li class="task-item">
          <div class="task-text">${t.desc}</div>
          <div class="actions">
            <button class="btn-icon" onclick="move(${i}, -1)"><i class="fa-solid fa-chevron-up"></i></button>
            <button class="btn-icon" onclick="move(${i}, 1)"><i class="fa-solid fa-chevron-down"></i></button>
            <button class="btn-icon" onclick="del(${t.id})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </li>
      `).join('');
    }
    function move(i, dir) {
      const newI = i + dir;
      if (newI >= 0 && newI < tasks.length) { [tasks[i], tasks[newI]] = [tasks[newI], tasks[i]]; render(); }
    }
    function del(id) { tasks = tasks.filter(t => t.id !== id); render(); }
  </script>
</body>
</html>
